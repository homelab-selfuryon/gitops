# octo-sts trust policy `app-register`: the token a new app's register workflow uses to open
# the PR that adds its registration (apps/<team>/<app>/ and registry.cue). No auto-merge: platform
# approves, and gitops-verify checks the team against the repository's `owner-team` property.
#
# Only app-register.yaml of github-workflows, on a push to main of a repository of this org
# whose custom property `kind` is `app` (properties are OIDC claims `repo_property_<name>`,
# set by platform-terraform, which members cannot change).
issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:homelab-selfuryon@353728095/[a-z][a-z0-9-]{1,40}@[0-9]+:ref:refs/heads/main
claim_pattern:
  repository_owner: homelab-selfuryon
  event_name: push
  repo_property_kind: app
  job_workflow_ref: homelab-selfuryon/github-workflows/\.github/workflows/app-register\.yaml@.+
permissions:
  contents: write
  pull_requests: write
