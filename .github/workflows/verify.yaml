name: Verify

# Checks of a pull request. This repository's own workflow: nothing in it is signed, so no reusable
# workflow is needed.
#
#   1. who changed what: a PR from the release bot touches exactly its own files
#      (scripts/gitops_checks.py of the BASE branch, so a PR cannot weaken the check)
#   2. layout, `cue fmt --check`, `cue vet -c`, `cue cmd render`, kubeconform on the render
#   3. a changed registration: deploy.cue's team is the repository's `owner-team` property and the
#      repository has kind=app
#   4. for every changed version file: the tag resolves to the digest, the signature, workflow
#      identity and source repository (the registration's repo) check out
#   5. Kyverno CLI over the changed app manifests with the policy set the cluster runs today
#      (platform-components' sets are checked at their source, scripts/kyverno-check.sh there)
#   6. object diff base -> head as a PR comment
#
# Tools: gitops' own devenv (cue, kubeconform, kyverno, python, yq), cosign and oras from pinned
# setup actions. The base branch is evaluated with the head's devenv.
#

on:
  pull_request:

permissions: {}

env:
  DEVENV_VERSION: v2.4.0
  REGISTRY: ghcr.io/homelab-selfuryon

jobs:
  verify:
    name: gitops verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull and verify artifacts
      pull-requests: write # the diff comment, changed-files listing
    concurrency:
      group: gitops-verify-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"

      # ~/.docker/config.json: read by buildx, oras and cue (platform-kit comes from GHCR).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Changed files
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | sort -u > "$RUNNER_TEMP/files.txt"
          cat "$RUNNER_TEMP/files.txt"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

      - name: Who changed what
        run: |
          set -euo pipefail
          python3 -I base/scripts/gitops_checks.py release-pr \
            --branch "$HEAD_REF" --author "$AUTHOR" - < "$RUNNER_TEMP/files.txt"
          python3 -I base/scripts/gitops_checks.py layout --root head
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}

      - name: CUE fmt, vet and render
        working-directory: head
        run: |
          set -euo pipefail
          devenv shell -- cue fmt --check ./...
          devenv shell -- cue vet -c ./...
          devenv shell -- cue cmd render

      - name: kubeconform
        working-directory: head
        run: |
          set -euo pipefail
          find out -name '*.yaml' ! -name kustomization.yaml -print0 | xargs -0 --no-run-if-empty \
            devenv shell -- kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      # The registry of both sides as JSON (the base side only for the diff).
      - name: Registry data
        run: |
          set -euo pipefail
          devenv_head() { (cd head && devenv shell -- "$@"); }
          devenv_head cue export -e apps --out json > "$RUNNER_TEMP/apps-head.json"
          devenv_head bash -c 'cd ../base && cue export -e apps --out json' > "$RUNNER_TEMP/apps-base.json"

      # A registration says which team owns which repository. The repository's `owner-team` custom
      # property (set by platform-terraform) is the truth: a team cannot register another team's name.
      - name: Registrations match the repository properties
        run: |
          set -euo pipefail
          python3 -I base/scripts/gitops_checks.py registrations \
            --root head --apps "$RUNNER_TEMP/apps-head.json" - < "$RUNNER_TEMP/files.txt" > "$RUNNER_TEMP/registrations.jsonl"
          while read -r item; do
            team=$(jq -r .team <<<"$item"); repo=$(jq -r .repo <<<"$item")
            [[ "$team" =~ ^[a-z][a-z0-9-]{1,30}$ ]]
            [[ "$repo" =~ ^homelab-selfuryon/[a-z][a-z0-9-]{1,40}$ ]]
            # Readable with read access to the repository (public repositories: anyone).
            props=$(gh api "repos/${repo}/properties/values")
            owner=$(jq -r '.[] | select(.property_name == "owner-team") | .value' <<<"$props")
            kind=$(jq -r '.[] | select(.property_name == "kind") | .value' <<<"$props")
            [[ "$owner" == "$team" ]] || { echo "::error::${repo}: deploy.cue team is '${team}', the repository's owner-team is '${owner}'"; exit 1; }
            [[ "$kind" == "app" ]] || { echo "::error::${repo}: kind is '${kind}', not app"; exit 1; }
            echo "registration ${repo}: team ${team} matches owner-team, kind app"
          done < "$RUNNER_TEMP/registrations.jsonl"
        env:
          GH_TOKEN: ${{ github.token }}

      # Pulls a manifests artifact into <dir> as one file per object (<dir>/<name>/<prefix>/<namespace>/<kind>/<name>.yml).
      - name: Verify the referenced artifacts
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/collect.sh" <<'COLLECT'
          # collect <root> <apps.json> <outdir> <verify:0|1>
          set -euo pipefail
          root=$1; apps=$2; outdir=$3; verify=$4
          python3 -I "$GITHUB_WORKSPACE/base/scripts/gitops_checks.py" artifacts \
            --root "$root" --apps "$apps" - < "$RUNNER_TEMP/files.txt" |
          while read -r item; do
            artifact=$(jq -r .artifact <<<"$item"); tag=$(jq -r .tag <<<"$item")
            digest=$(jq -r .digest <<<"$item"); workflow=$(jq -r .workflow <<<"$item")
            repo=$(jq -r .repo <<<"$item")
            [[ "$artifact" =~ ^ghcr\.io/homelab-selfuryon/[a-z0-9/-]+$ ]]
            [[ "$tag" =~ ^[0-9A-Za-z._-]+$ ]]
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$workflow" =~ ^(app-release|components-release)$ ]]
            [[ "$repo" =~ ^homelab-selfuryon/[a-z0-9-]+$ ]]
            if [[ "$verify" == 1 ]]; then
              resolved=$(oras resolve "${artifact}:${tag}")
              if [[ "$resolved" != "$digest" ]]; then
                echo "::error::${artifact}:${tag} resolves to ${resolved}, the version file says ${digest}"
                exit 1
              fi
              if [[ "$workflow" == app-release ]]; then
                # Signed by the reusable workflow, from the release tag of the app repository (tag = version).
                cosign verify \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  --certificate-identity-regexp "^https://github\.com/homelab-selfuryon/github-workflows/\.github/workflows/app-release\.yaml@.+\$" \
                  --certificate-github-workflow-repository "$repo" \
                  --certificate-github-workflow-ref "refs/tags/${tag}" \
                  "${artifact}@${digest}" > /dev/null
              else
                # Signed by platform-components' own release job on main.
                cosign verify \
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                  --certificate-identity "https://github.com/homelab-selfuryon/platform-components/.github/workflows/release.yaml@refs/heads/main" \
                  --certificate-github-workflow-repository "$repo" \
                  --certificate-github-workflow-ref refs/heads/main \
                  "${artifact}@${digest}" > /dev/null
              fi
              echo "verified ${artifact}@${digest} (${tag}, ${workflow}, ${repo})"
            fi
            name=$(echo "${artifact#ghcr.io/homelab-selfuryon/}" | tr '/' '-')-$(jq -r .file <<<"$item" | tr '/.' '--')
            dir="$outdir/$name"; raw=$(mktemp -d)
            mkdir -p "$dir"
            (cd "$raw" && oras pull "${artifact}@${digest}" > /dev/null && tar -xzf ./*.tar.gz)
            # An app artifact holds staging/ and prod/, objects without a namespace (Argo CD sets it to
            # <team>-<env>). A version file moves one environment: only that one is diffed and checked,
            # in the namespace Argo CD would give it (without it Kyverno sees two same-named objects in
            # `default`).
            env=$(jq -r '.env // empty' <<<"$item"); team=$(jq -r '.team // empty' <<<"$item")
            src="$raw"
            if [[ -n "$env" ]]; then
              [[ "$env" =~ ^(staging|prod)$ && "$team" =~ ^[a-z][a-z0-9-]{1,30}$ ]]
              src="$raw/$env"
              find "$src" -name '*.yaml' -print0 |
                NS="$team-$env" xargs -0 -r yq -i '(select(.kind != null and .metadata.namespace == null) | .metadata.namespace) = strenv(NS)'
            fi
            # one file per object
            while IFS= read -r -d '' f; do
              prefix=$(basename "$(dirname "$f")"); prefix=${prefix//[^A-Za-z0-9._-]/_}
              (cd "$dir" && PREFIX="$prefix" yq -P -s \
                'strenv(PREFIX) + "/" + (.metadata.namespace // "_cluster") + "/" + (.kind | downcase) + "/" + .metadata.name' \
                'select(.kind != null) | sort_keys(..)' "$f")
            done < <(find "$src" -name '*.yaml' ! -name kustomization.yaml -print0)
          done
          COLLECT
          mkdir -p "$RUNNER_TEMP/diff/head" "$RUNNER_TEMP/diff/base"
          bash "$RUNNER_TEMP/collect.sh" "$GITHUB_WORKSPACE/head" "$RUNNER_TEMP/apps-head.json" "$RUNNER_TEMP/diff/head/artifacts" 1
          # The base side is only for the diff; its digests were verified when they were merged.
          bash "$RUNNER_TEMP/collect.sh" "$GITHUB_WORKSPACE/base" "$RUNNER_TEMP/apps-base.json" "$RUNNER_TEMP/diff/base/artifacts" 0 || true

      - name: Kyverno policies of the running policy set
        # App manifests only: platform-components' sets were checked at their source with every
        # policy, the CRDs and the component ServiceAccounts (its scripts/kyverno-check.sh).
        # Policies that read request.userInfo judge component and deploy ServiceAccounts, not the
        # objects of an app, and the CLI cannot evaluate them without one: they are left out.
        # Objects of custom kinds are left out too (no CRDs here; the tenant policies look at
        # built-in kinds) and listed. Every run must end with fail: 0 and error: 0.
        run: |
          set -euo pipefail
          shopt -s nullglob
          status=0
          mapfile -t resources < <(find "$RUNNER_TEMP/diff/head/artifacts" -mindepth 1 -maxdepth 1 -type d ! -name 'platform-components-*' -print0 2>/dev/null |
            xargs -0 -r -I{} find {} -type f -name '*.yml' | sort)
          if [[ ${#resources[@]} -eq 0 ]]; then
            echo "::notice::no changed app manifests; platform sets are checked in platform-components"
            exit 0
          fi
          builtin='^(v1|(apps|batch|policy|autoscaling|networking\.k8s\.io|rbac\.authorization\.k8s\.io|discovery\.k8s\.io|scheduling\.k8s\.io|storage\.k8s\.io|coordination\.k8s\.io)/[a-z0-9]+)$'
          checked=(); skipped=()
          for r in "${resources[@]}"; do
            if [[ $(yq '.apiVersion' "$r") =~ $builtin ]]; then checked+=(--resource "$r"); else skipped+=("$(yq '.kind' "$r")"); fi
          done
          if [[ ${#skipped[@]} -gt 0 ]]; then
            echo "not checked (custom kinds): $(printf '%s\n' "${skipped[@]}" | sort | uniq -c | awk '{printf "%s x%s, ", $2, $1}')"
          fi
          if [[ ${#checked[@]} -eq 0 ]]; then
            echo "::notice::no app objects of built-in kinds to check"
            exit 0
          fi
          for rel in base/clusters/*/releases.json; do
            cluster=$(basename "$(dirname "$rel")")
            digest=$(jq -r '.policy.digest // empty' "$rel")
            if [[ -z "$digest" ]]; then
              echo "::notice::${cluster}: no policy set released yet, Kyverno check skipped"
              continue
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            dir="$RUNNER_TEMP/policy-${cluster}"; mkdir -p "$dir"
            (cd "$dir" && oras pull "${REGISTRY}/platform-components/${cluster}-policy@${digest}" > /dev/null && tar -xzf ./*.tar.gz)
            policies="$RUNNER_TEMP/policies-${cluster}.yaml"
            find "$dir" -name '*.yaml' -print0 | xargs -0 yq 'select(.apiVersion == "policies.kyverno.io/*") | select(to_json | test("request\\.userInfo") | not)' > "$policies"
            if [[ ! -s $policies ]]; then
              echo "::notice::${cluster}: the policy set holds no applicable Kyverno policies"
              continue
            fi
            out="$RUNNER_TEMP/kyverno-${cluster}.txt"
            # kyverno apply exits 1 on errors and failures alike: the summary line decides.
            (cd head && devenv shell -- kyverno apply "$policies" "${checked[@]}") > "$out" 2>&1 || true
            summary=$(grep -E '^pass: [0-9]+, fail: [0-9]+' "$out" | tail -1 || true)
            if [[ -z $summary ]]; then
              cat "$out"; echo "::error::${cluster}: kyverno did not complete"; status=1; continue
            fi
            if [[ ! $summary =~ fail:\ 0,.*error:\ 0, ]]; then
              grep -E -A3 'failed:|error:|^Error' "$out" || cat "$out"
              echo "::error::${cluster}: ${summary}"; status=1; continue
            fi
            echo "${cluster}: ${summary}"
          done
          exit "$status"

      - name: Render both sides for the diff
        run: |
          set -euo pipefail
          (cd head && devenv shell -- bash -c 'cd ../base && cue cmd render')
          for side in base head; do
            mkdir -p "$RUNNER_TEMP/diff/$side/render"
            cp -r "$side/out/." "$RUNNER_TEMP/diff/$side/render/"
          done

      - name: Generate diff
        id: diff
        uses: int128/diff-action@7d157ee0e4e33a930be4a424f41e805390f0ff19 # v2.43.0
        with:
          head: ${{ runner.temp }}/diff/head
          base: ${{ runner.temp }}/diff/base

      - uses: int128/comment-action@304df51b76a99f2ba948f8d780d789b5ecc22893 # v1.80.0
        if: steps.diff.outputs.comment-body != ''
        with:
          update-if-exists: replace
          update-if-exists-key: gitops-verify
          post: |
            ## Object diff
            ${{ steps.diff.outputs.comment-body }}

  tests:
    name: Tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"
      # treefmt, cue vet, unit tests of the PR checks, render with sample digests, shellcheck
      - name: devenv test
        run: devenv test

  lint:
    name: Lint workflows
    permissions:
      contents: read
    uses: homelab-selfuryon/github-workflows/.github/workflows/lint-workflows.yaml@c49b40a6acc765b064daff0e0e8e9c3bc6486a37 # v1.0.1

  # The single required status check (branch ruleset).
  final-check:
    needs: [verify, tests, lint]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results
        run: |
          for r in "verify=$VERIFY" "tests=$TESTS" "lint=$LINT"; do
            [[ "${r#*=}" == success ]] || { echo "$r"; exit 1; }
          done
        env:
          VERIFY: ${{ needs.verify.result }}
          TESTS: ${{ needs.tests.result }}
          LINT: ${{ needs.lint.result }}
